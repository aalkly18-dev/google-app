name: CI/CD Pipeline & Render Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App (Debug)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not in root, searching..."
            find . -name "gradlew"
          fi

      - name: Trigger Render Webhook
        if: env.RENDER_DEPLOY_URL != ''
        env:
          RENDER_DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering deployment on Render..."
          curl -X POST "$RENDER_DEPLOY_URL"
