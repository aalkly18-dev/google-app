name: CI/CD Pipeline & Render Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App (Debug)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Searching for gradlew..."
            find . -name "gradlew" -exec chmod +x {} \;
            # إذا كان Gradle موجوداً في مسار فرعي
            gradle_path=$(find . -name "gradlew" -quit)
            if [ -n "$gradle_path" ]; then
              dir_path=$(dirname "$gradle_path")
              cd "$dir_path" && ./gradlew assembleDebug
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: uranium-agent-debug
          path: '**/outputs/apk/debug/*.apk'

      - name: Trigger Render Webhook
        if: env.RENDER_DEPLOY_URL != ''
        env:
          RENDER_DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering deployment on Render..."
          curl -X POST "$RENDER_DEPLOY_URL"
