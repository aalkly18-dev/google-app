name: CI/CD Pipeline & Render Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App (Debug)
        run: |
          # البحث عن مكان ملف gradlew وتنفيذ البناء في مجلده مباشرة
          gradle_file=$(find . -name "gradlew" -quit)
          if [ -n "$gradle_file" ]; then
            proj_dir=$(dirname "$gradle_file")
            echo "Found project directory at: $proj_dir"
            cd "$proj_dir"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Error: gradlew not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uranium-agent-debug
          path: '**/build/outputs/apk/debug/*.apk'

      - name: Trigger Render Webhook
        if: env.RENDER_DEPLOY_URL != ''
        env:
          RENDER_DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering deployment on Render..."
          curl -X POST "$RENDER_DEPLOY_URL"
